name: Build Rudy 18x32 Windows Wheel

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-rudy-arena18x32-windows.yml"
      - "tools/rudy_windows/patch_rudy_arena_18x32.py"
      - "tools/rudy_windows/patch_rudy_building_grid.py"
      - "tools/rudy_windows/patch_rudy_building_deploy_targeting.py"
      - "tools/rudy_windows/patch_rudy_normal_evolution_semantics.py"
      - "tools/rudy_windows/patch_rudy_building_hp_decay.py"
      - "tools/rudy_windows/patch_rudy_attack_timing.py"
      - "tools/rudy_windows/patch_rudy_troop_speed.py"

permissions:
  contents: read

jobs:
  build-wheel:
    runs-on: windows-latest

    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Checkout pinned Rudy source
        uses: actions/checkout@v4
        with:
          repository: nguiaSoren/clash-royale-suite
          ref: 050275d70b84614953877e8075dc4b8ba907c67f
          path: third_party/clash-royale-suite
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Patch arena geometry and edge-to-edge combat
        run: python tools/rudy_windows/patch_rudy_arena_18x32.py

      - name: Patch half-tile building grid centres
        run: python tools/rudy_windows/patch_rudy_building_grid.py

      - name: Patch building pull during deployment
        run: python tools/rudy_windows/patch_rudy_building_deploy_targeting.py

      - name: Keep normal card plays non-evolved
        run: python tools/rudy_windows/patch_rudy_normal_evolution_semantics.py

      - name: Patch continuous building HP decay
        run: python tools/rudy_windows/patch_rudy_building_hp_decay.py

      - name: Patch Clash Royale troop movement speeds
        run: python tools/rudy_windows/patch_rudy_troop_speed.py

      - name: Patch first-hit timing semantics
        run: python tools/rudy_windows/patch_rudy_attack_timing.py

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build cr_engine wheel
        working-directory: third_party/clash-royale-suite/cr-rudy-sim/simulator
        run: python -m maturin build --release --interpreter python

      - name: Show built wheel
        shell: pwsh
        run: Get-ChildItem third_party/clash-royale-suite/cr-rudy-sim/simulator/engine/target/wheels/*.whl

      - name: Upload patched wheel
        uses: actions/upload-artifact@v4
        with:
          name: cr-engine-arena18x32-win64-py3.12
          path: third_party/clash-royale-suite/cr-rudy-sim/simulator/engine/target/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
