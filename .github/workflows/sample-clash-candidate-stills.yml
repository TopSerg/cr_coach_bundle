name: Sample Clash candidate stills

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/sample-clash-candidate-stills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade yt-dlp imageio-ffmpeg
      - name: Resolve 360p HLS
        run: |
          yt-dlp -g -f "360p/480p/160p" "https://www.twitch.tv/videos/2868878839" | head -1 > stream_url.txt
      - name: Sample untested deck screens
        shell: bash
        run: |
          mkdir stills
          URL="$(cat stream_url.txt)"
          FFMPEG="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          for sec in 5705 5715 5725 5735 5745 6120 6130 6140 6150 6160 7370 7380 7390 7400 7410; do
            "$FFMPEG" -hide_banner -loglevel error -ss "$sec" -i "$URL" -frames:v 1 -q:v 2 "stills/t_${sec}.jpg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: clash-candidate-stills-targeted
          path: stills
          retention-days: 1
