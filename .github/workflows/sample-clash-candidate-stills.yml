name: Sample Clash candidate stills

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/sample-clash-candidate-stills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp
      - name: Resolve 360p HLS
        run: |
          yt-dlp -g -f "360p/480p/160p" "https://www.twitch.tv/videos/2868878839" | head -1 > stream_url.txt
      - name: Sample stills
        shell: bash
        run: |
          mkdir stills
          URL="$(cat stream_url.txt)"
          for sec in 4789 5414 5727 6560 6976 7080 7393 7705; do
            ffmpeg -hide_banner -loglevel error -ss "$sec" -i "$URL" -frames:v 1 -q:v 2 "stills/t_${sec}.jpg"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: clash-candidate-stills
          path: stills
          retention-days: 1
