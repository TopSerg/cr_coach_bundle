name: Build Rudy Windows Wheels

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-rudy-windows.yml"

permissions:
  contents: read

jobs:
  build-wheel:
    name: Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout this project
        uses: actions/checkout@v4

      - name: Checkout cr-rudy-sim source
        uses: actions/checkout@v4
        with:
          repository: nguiaSoren/clash-royale-suite
          path: third_party/clash-royale-suite
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build cr_engine wheel
        working-directory: third_party/clash-royale-suite/cr-rudy-sim/simulator
        run: python -m maturin build --release --interpreter python

      - name: Show built wheels
        shell: pwsh
        run: Get-ChildItem third_party/clash-royale-suite/cr-rudy-sim/simulator/engine/target/wheels/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cr-engine-win64-py${{ matrix.python-version }}
          path: third_party/clash-royale-suite/cr-rudy-sim/simulator/engine/target/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
