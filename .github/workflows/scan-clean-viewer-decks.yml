name: Scan viewer decks for clean match

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/scan-clean-viewer-decks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --upgrade yt-dlp imageio-ffmpeg
      - name: Resolve low-res HLS
        run: |
          yt-dlp -g -f "160p/360p/worst" "https://www.twitch.tv/videos/2868878839" | head -1 > stream_url.txt
      - name: Sample every 10 seconds from 65m to 130m
        run: |
          mkdir frames
          ffmpeg -hide_banner -loglevel warning             -ss 3900 -i "$(cat stream_url.txt)" -t 3900             -vf "fps=1/10,scale=320:-1" -q:v 5 frames/frame_%04d.jpg
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path("frames").glob("frame_*.jpg"))
          with open("frames/index.csv","w",encoding="utf-8") as f:
              f.write("file,vod_seconds,vod_time\n")
              for i,p in enumerate(files):
                  sec=3900+i*10
                  f.write(f"{p.name},{sec},{sec//60:02d}:{sec%60:02d}\n")
          print("frames",len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-deck-scan-65m-130m
          path: frames
          retention-days: 1
