name: Fetch BigSpin Sep10 low-level F2P match

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/fetch-bigspin-sep10-low-f2p.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade yt-dlp
      - name: Download 4h24m30s to 4h29m40s from 480p HLS
        shell: python
        run: |
          import json, re, subprocess, urllib.parse, urllib.request
          from pathlib import Path
          url=subprocess.check_output([
            "yt-dlp","-g","-f","480p/360p/160p",
            "https://www.twitch.tv/videos/2870568499"
          ],text=True).splitlines()[0].strip()
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          text=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          lines=[x.strip() for x in text.splitlines() if x.strip()]
          segs=[]; cur=0.0; dur=None; init_url=None
          for line in lines:
            if line.startswith("#EXT-X-MAP:"):
              m=re.search(r'URI="([^"]+)"',line)
              if m: init_url=urllib.parse.urljoin(url,m.group(1))
            elif line.startswith("#EXTINF:"):
              dur=float(line.split(":",1)[1].split(",",1)[0])
            elif not line.startswith("#") and dur is not None:
              segs.append({"start":cur,"end":cur+dur,"duration":dur,"url":urllib.parse.urljoin(url,line)})
              cur+=dur; dur=None
          start,end=15870,16180
          selected=[(i,s) for i,s in enumerate(segs) if s["end"]>start and s["start"]<end]
          out=Path("match"); out.mkdir()
          if init_url:
            r=urllib.request.Request(init_url,headers={"User-Agent":"Mozilla/5.0"})
            (out/"init.mp4").write_bytes(urllib.request.urlopen(r,timeout=30).read())
          rows=[]
          for i,s in selected:
            name=f"seg_{i:05d}_{s['start']:.3f}.m4s"
            r=urllib.request.Request(s["url"],headers={"User-Agent":"Mozilla/5.0"})
            data=urllib.request.urlopen(r,timeout=30).read()
            (out/name).write_bytes(data)
            rows.append({"index":i,"file":name,**{k:s[k] for k in ("start","end","duration")}})
          (out/"manifest.json").write_text(json.dumps({"vod":"2870568499","range":[start,end],"segments":rows},indent=2),encoding="utf-8")
          print("duration",cur,"segments",len(rows),"range",rows[0]["start"],rows[-1]["end"])
      - uses: actions/upload-artifact@v4
        with:
          name: bigspin-sep10-low-f2p-match
          path: match
          retention-days: 2
