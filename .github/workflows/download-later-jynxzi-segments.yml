name: Download later Jynxzi HLS sample segments

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/download-later-jynxzi-segments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Resolve 160p HLS
        run: |
          yt-dlp -g -f "160p/worst" "https://www.twitch.tv/videos/2868878839" | head -1 > stream_url.txt
      - name: Download one HLS segment every 10 seconds from 78m to 140m
        shell: python
        run: |
          import json, urllib.parse, urllib.request
          from pathlib import Path

          playlist_url=Path("stream_url.txt").read_text().strip()
          req=urllib.request.Request(playlist_url,headers={"User-Agent":"Mozilla/5.0"})
          text=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          lines=[x.strip() for x in text.splitlines() if x.strip()]
          segments=[]; current=0.0; dur=None
          for line in lines:
              if line.startswith("#EXTINF:"):
                  dur=float(line.split(":",1)[1].split(",",1)[0])
              elif not line.startswith("#") and dur is not None:
                  segments.append({"start":current,"end":current+dur,"duration":dur,
                                   "url":urllib.parse.urljoin(playlist_url,line)})
                  current+=dur; dur=None
          from concurrent.futures import ThreadPoolExecutor, as_completed
          out=Path("segments"); out.mkdir()
          jobs=[]
          for sec in range(4680,8400,10):
              idx=next((i for i,s in enumerate(segments) if s["start"] <= sec < s["end"]),None)
              if idx is None: continue
              jobs.append((sec,idx,segments[idx]))
          def fetch(job):
              sec,idx,s=job
              name=f"t_{sec:05d}_seg_{idx:05d}.ts"
              rq=urllib.request.Request(s["url"],headers={"User-Agent":"Mozilla/5.0"})
              data=urllib.request.urlopen(rq,timeout=30).read()
              (out/name).write_bytes(data)
              return {"requested_s":sec,"requested_time":f"{sec//60:02d}:{sec%60:02d}",
                      "segment_index":idx,"segment_start":s["start"],"segment_end":s["end"],
                      "file":name,"bytes":len(data)}
          chosen=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              futures=[ex.submit(fetch,j) for j in jobs]
              for fut in as_completed(futures):
                  chosen.append(fut.result())
          chosen.sort(key=lambda x:x["requested_s"])
          (out/"manifest.json").write_text(json.dumps(chosen,indent=2),encoding="utf-8")
          print("downloaded",len(chosen),"segments",sum(x["bytes"] for x in chosen),"bytes")
      - uses: actions/upload-artifact@v4
        with:
          name: jynxzi-hls-scan-segments-78m-140m
          path: segments
          retention-days: 1
