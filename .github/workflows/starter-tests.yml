name: starter-tests

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest tests -q

  crbot-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Keschler/cr-bot
          ref: 40ca2b16bc276fc982a3aa80c7415b24439cbd3c
          path: .physical_deps/cr-bot
          sparse-checkout: |
            simulator
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/smoke_crbot_adapter.py

  physical-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Keschler/cr-bot
          ref: 40ca2b16bc276fc982a3aa80c7415b24439cbd3c
          path: .physical_deps/cr-bot
          sparse-checkout: |
            simulator
          sparse-checkout-cone-mode: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python physical_tests/run_all.py
