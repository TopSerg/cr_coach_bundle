name: Fetch clean RoyaleAPI replay candidate\n\non:\n  push:\n    branches:\n      - probe/current-patch-demo\n    paths:\n      - ".github/workflows/fetch-clean-royaleapi-replay.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  fetch:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - name: Fetch player battles page\n        run: |\n          python - <<'PY'\n          import urllib.request\n          url="https://royaleapi.com/player/8CYYYG22Y/battles?lang=en"\n          req=urllib.request.Request(url,headers={\n            "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36",\n            "Accept":"text/html,application/xhtml+xml",\n          })\n          try:\n            with urllib.request.urlopen(req,timeout=30) as r:\n              data=r.read()\n              print("STATUS",r.status,"BYTES",len(data),"URL",r.url)\n              open("battles.html","wb").write(data)\n          except Exception as e:\n            print("FETCH_ERROR",repr(e))\n            raise\n          PY\n      - name: Extract replay links\n        run: |\n          python - <<'PY'\n          import re,html\n          text=open("battles.html",encoding="utf-8",errors="replace").read()\n          print("TITLE", re.findall(r"<title[^>]*>(.*?)</title>",text,re.I|re.S)[:3])\n          links=[]\n          for m in re.finditer(r'(?:href|data-url)=["\']([^"\']*?/replay\?[^"\']+)["\']',text,re.I):\n            u=html.unescape(m.group(1))\n            if u not in links: links.append(u)\n          print("REPLAY_LINKS",len(links))\n          for u in links[:50]: print("REPLAY",u)\n          open("replay_links.txt","w",encoding="utf-8").write("\n".join(links))\n          PY\n      - uses: actions/upload-artifact@v4\n        with:\n          name: royaleapi-clean-candidate-page\n          path: |\n            battles.html\n            replay_links.txt\n          retention-days: 1\n