name: Fetch clean RoyaleAPI replay candidate

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/fetch-clean-royaleapi-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch player battles page
        run: |
          curl -fL --retry 3 --connect-timeout 20 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/152 Safari/537.36" \
            "https://royaleapi.com/player/8CYYYG22Y/battles?lang=en" \
            -o battles.html
          wc -c battles.html
          grep -oE '/replay\?[^"< >]+' battles.html | sed 's/&amp;/\&/g' | sort -u > replay_links.txt || true
          echo "Replay links:"
          cat replay_links.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: royaleapi-clean-candidate-page
          path: |
            battles.html
            replay_links.txt
          retention-days: 1
