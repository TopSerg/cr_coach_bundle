name: Fetch clean RoyaleAPI replay candidate

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/fetch-clean-royaleapi-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch player battles page
        run: |
          python - <<'PY'
          import urllib.request
          url="https://royaleapi.com/player/8CYYYG22Y/battles?lang=en"
          req=urllib.request.Request(url,headers={
            "User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/152 Safari/537.36",
            "Accept":"text/html,application/xhtml+xml",
          })
          try:
            with urllib.request.urlopen(req,timeout=30) as r:
              data=r.read()
              print("STATUS",r.status,"BYTES",len(data),"URL",r.url)
              open("battles.html","wb").write(data)
          except Exception as e:
            print("FETCH_ERROR",repr(e))
            raise
          PY
      - name: Extract replay links
        run: |
          python - <<'PY'
          import re,html
          text=open("battles.html",encoding="utf-8",errors="replace").read()
          print("TITLE", re.findall(r"<title[^>]*>(.*?)</title>",text,re.I|re.S)[:3])
          links=[]
          for m in re.finditer(r'(?:href|data-url)=["\']([^"\']*?/replay\?[^"\']+)["\']',text,re.I):
            u=html.unescape(m.group(1))
            if u not in links: links.append(u)
          print("REPLAY_LINKS",len(links))
          for u in links[:50]: print("REPLAY",u)
          open("replay_links.txt","w",encoding="utf-8").write("
".join(links))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: royaleapi-clean-candidate-page
          path: |
            battles.html
            replay_links.txt
          retention-days: 1
