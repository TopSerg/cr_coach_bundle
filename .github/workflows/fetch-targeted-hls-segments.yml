name: Fetch targeted Twitch HLS segments

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/fetch-targeted-hls-segments.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: Resolve Twitch HLS
        run: |
          yt-dlp -g -f "360p/480p/160p" "https://www.twitch.tv/videos/2868878839" | head -1 > stream_url.txt
      - name: Download segments covering target deck screens
        shell: python
        run: |
          import json, re, urllib.parse, urllib.request
          from pathlib import Path

          playlist_url=Path("stream_url.txt").read_text().strip()
          req=urllib.request.Request(playlist_url, headers={"User-Agent":"Mozilla/5.0"})
          text=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          Path("playlist.m3u8").write_text(text,encoding="utf-8")
          lines=[x.strip() for x in text.splitlines() if x.strip()]
          segments=[]
          current=0.0
          dur=None
          for line in lines:
              if line.startswith("#EXTINF:"):
                  dur=float(line.split(":",1)[1].split(",",1)[0])
              elif not line.startswith("#") and dur is not None:
                  url=urllib.parse.urljoin(playlist_url,line)
                  segments.append({"start":current,"end":current+dur,"duration":dur,"url":url})
                  current+=dur
                  dur=None
          print("segment_count",len(segments),"duration",current)
          targets=[5705,5715,5725,5735,5745,6120,6130,6140,6150,6160,7370,7380,7390,7400,7410]
          out=Path("segments"); out.mkdir()
          manifest=[]
          downloaded={}
          for target in targets:
              idx=next((i for i,s in enumerate(segments) if s["start"] <= target < s["end"]),None)
              if idx is None:
                  print("missing target",target)
                  continue
              for j in range(max(0,idx-1),min(len(segments),idx+2)):
                  s=segments[j]
                  key=j
                  if key not in downloaded:
                      name=f"seg_{j:05d}_{s['start']:.3f}.ts"
                      rq=urllib.request.Request(s["url"],headers={"User-Agent":"Mozilla/5.0"})
                      data=urllib.request.urlopen(rq,timeout=30).read()
                      (out/name).write_bytes(data)
                      downloaded[key]=name
                      print("downloaded",name,len(data))
                  manifest.append({"target":target,"segment_index":j,"file":downloaded[key],**{k:s[k] for k in ("start","end","duration")}})
          (out/"manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
      - uses: actions/upload-artifact@v4
        with:
          name: targeted-deck-hls-segments
          path: segments
          retention-days: 1
