name: Download viewer-deck VOD storyboard

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/probe-current-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storyboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade yt-dlp
      - name: Download high storyboard
        run: |
          yt-dlp --skip-download --write-subs 2>/dev/null || true
          yt-dlp -f sb0 -o "storyboard.%(ext)s" "https://www.twitch.tv/videos/2868878839"
          ls -lh storyboard.*
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-deck-storyboard
          path: storyboard.*
          retention-days: 1
