name: Discover fresh no-special-form VOD

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/probe-current-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: List recent Jynxzi Twitch archives
        run: |
          yt-dlp --flat-playlist --playlist-end 12             --print "%(id)s|%(duration)s|%(title)s"             "https://www.twitch.tv/jynxzi/videos?filter=archives&sort=time"             | tee jynxzi_vods.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jynxzi-vod-list
          path: jynxzi_vods.txt
          retention-days: 1
