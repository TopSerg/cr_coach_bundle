name: Locate Clash segment in viewer-deck VOD

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/probe-current-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade yt-dlp
      - name: Inspect Twitch VOD metadata and formats
        run: |
          yt-dlp --skip-download --dump-single-json "https://www.twitch.tv/videos/2868878839" > info.json
          python - <<'PY'
          import json
          j=json.load(open("info.json",encoding="utf-8"))
          for k in ("id","timestamp","upload_date","duration","title","categories","tags","chapters","thumbnail"):
              print(k, "=", j.get(k))
          print("FORMATS")
          for f in j.get("formats",[]):
              print(f.get("format_id"), f.get("ext"), f.get("protocol"), f.get("width"), f.get("height"), f.get("format_note"), f.get("url","")[:180])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-deck-vod-info
          path: info.json
          retention-days: 1
