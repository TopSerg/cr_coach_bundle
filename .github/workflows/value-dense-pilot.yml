name: CR Coach Value tokenwise 4500

on:
  push:
    branches:
      - "ml/value-dense-prefix-pilot"
    paths:
      - "ml/value_baseline/**"
      - ".github/workflows/value-dense-pilot.yml"

permissions:
  contents: read

concurrency:
  group: value-tokenwise-4500-${{ github.sha }}
  cancel-in-progress: false

jobs:
  train-tokenwise-value:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      COCHON_SHA: eec3887c94faecb7e9108f5d53d24a86b6bf08d5
    steps:
      - name: Checkout CR Coach
        uses: actions/checkout@v4

      - name: Checkout replay pipeline (pinned)
        uses: actions/checkout@v4
        with:
          repository: cochon123/clash-royale-ai
          ref: ${{ env.COCHON_SHA }}
          path: .deps/clash-royale-ai
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.3,<3"
          python -m pip install -r ml/value_baseline/requirements-actions.txt

      - name: Compile tokenwise trainer
        run: python -m py_compile ml/value_baseline/train_value_tokenwise.py

      - name: Train tokenwise Value model
        env:
          COCHON_SRC: .deps/clash-royale-ai/src
        run: |
          python ml/value_baseline/train_value_tokenwise.py \
            --max-files 4500 \
            --epochs 8 \
            --batch-size 16 \
            --d-model 96 \
            --layers 2 \
            --min-card-plays 8 \
            --min-events 8 \
            --trace-matches 5 \
            --output-dir outputs/value_tokenwise_4500

      - name: Print summary
        if: always()
        run: |
          if [[ -f outputs/value_tokenwise_pilot/SUMMARY.md ]]; then
            cat outputs/value_tokenwise_pilot/SUMMARY.md
            cat outputs/value_tokenwise_pilot/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload tokenwise pilot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-tokenwise-pilot-${{ github.run_number }}
          path: |
            outputs/value_tokenwise_pilot/value_transformer_tokenwise.pt
            outputs/value_tokenwise_pilot/report.json
            outputs/value_tokenwise_pilot/vocab.json
            outputs/value_tokenwise_pilot/SUMMARY.md
            outputs/value_tokenwise_pilot/prediction_traces.json
          if-no-files-found: warn
          retention-days: 14
