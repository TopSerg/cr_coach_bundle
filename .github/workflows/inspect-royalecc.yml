name: Probe RoyaleAPI battle endpoints

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/inspect-royalecc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe old/public RoyaleAPI endpoints
        run: |
          set +e
          for url in \
            "https://api.royaleapi.com/player/LJYQUG20/battles" \
            "https://royaleapi.com/player/LJYQUG20/battles?lang=en" \
            "https://royaleapi.com/player/LJYQUG20" ; do
            echo "=== $url ==="
            curl -sS -L -A "Mozilla/5.0" -D headers.tmp -o body.tmp "$url"
            echo "STATUS $(head -1 headers.tmp)"
            echo "TYPE $(grep -i '^content-type:' headers.tmp | tail -1)"
            echo "BYTES $(wc -c < body.tmp)"
            head -c 1000 body.tmp | tr '\n' ' '; echo
          done
      - uses: actions/upload-artifact@v4
        with:
          name: royaleapi-probe
          path: |
            body.tmp
            headers.tmp
          retention-days: 1
