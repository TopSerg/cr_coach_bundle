name: Inspect RoyaleCCTracker identifiers

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/inspect-royalecc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          curl -fL -A "Mozilla/5.0" "https://www.royalecctracker.com/latest-winners" -o latest.html
          curl -fL -A "Mozilla/5.0" "https://www.royalecctracker.com/leaderboard/09/2026" -o leaderboard.html
          echo "=== OLD RHOMBUS CONTEXT ==="
          grep -n -B4 -A8 -i "Old-Rhombus" latest.html || true
          echo "=== MINIKUI CONTEXT ==="
          grep -n -B4 -A8 -i "Minikui" latest.html || true
          echo "=== SCRIPT SRCS ==="
          grep -oE '<script[^>]+src="[^"]+"' latest.html | head -50 || true
          echo "=== POSSIBLE TAGS / API ==="
          grep -oE '(playerTag|player_tag|battleTag|battle_tag|api/[A-Za-z0-9_/?=&.-]+|#[0289PYLQGRJCUV]{6,})' latest.html | sort -u | head -100 || true
          echo "=== URLS ==="
          grep -oE 'https?://[^"'\'' <]+' latest.html | sort -u | head -100 || true
      - uses: actions/upload-artifact@v4
        with:
          name: royalecc-html
          path: |
            latest.html
            leaderboard.html
          retention-days: 1
