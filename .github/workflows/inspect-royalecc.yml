name: Inspect RoyaleCCTracker identifiers

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/inspect-royalecc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages and JS
        run: |
          curl -fL -A "Mozilla/5.0" "https://www.royalecctracker.com/latest-winners" -o latest.html
          curl -fL -A "Mozilla/5.0" "https://www.royalecctracker.com/_next/static/chunks/pages/latest-winners-a0bd0a944749761d.js" -o page.js
          echo "=== endpoints / fetch calls ==="
          grep -oE '.{0,120}(fetch\(|axios|/api/|latest-winners|wins|battle).{0,220}' page.js | head -120 || true
          echo "=== API-like strings ==="
          strings page.js | grep -Eo 'https?://[^" ]+|/api/[A-Za-z0-9_/?=&.-]+' | sort -u | head -100 || true
      - uses: actions/upload-artifact@v4
        with:
          name: royalecc-js
          path: |
            latest.html
            page.js
          retention-days: 1
