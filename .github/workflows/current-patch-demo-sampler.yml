name: Current patch demo sampler

on:
  push:
    branches:
      - probe/current-patch-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve direct video stream through public Invidious instances
        shell: python
        run: |
          import json
          import urllib.request

          video_id = "kAdFwFV0ZSM"
          instances = [
              "https://inv.nadeko.net",
              "https://invidious.nerdvpn.de",
              "https://yt.chocolatemoo53.com",
              "https://invidious.tiekoetter.com",
          ]
          errors = []
          for base in instances:
              endpoint = f"{base}/api/v1/videos/{video_id}"
              try:
                  req = urllib.request.Request(endpoint, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      data = json.load(resp)
                  streams = data.get("formatStreams") or []
                  candidates = []
                  for stream in streams:
                      url = stream.get("url")
                      label = str(stream.get("qualityLabel") or stream.get("quality") or "")
                      if not url:
                          continue
                      digits = "".join(ch for ch in label if ch.isdigit())
                      height = int(digits) if digits else 9999
                      if height <= 480:
                          candidates.append((height, url, label))
                  if not candidates:
                      raise RuntimeError(f"no <=480 muxed streams ({len(streams)} total)")
                  candidates.sort(key=lambda x: x[0], reverse=True)
                  chosen = candidates[0]
                  print(f"IV_INSTANCE={base}")
                  print(f"IV_QUALITY={chosen[2]}")
                  with open("stream_url.txt", "w", encoding="utf-8") as fh:
                      fh.write(chosen[1])
                  break
              except Exception as exc:
                  errors.append(f"{base}: {exc}")
          else:
              raise SystemExit("No Invidious instance succeeded:\n" + "\n".join(errors))
      - name: Download resolved video stream
        run: |
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20 \
            -o current_patch_demo.mp4 "$(cat stream_url.txt)"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 current_patch_demo.mp4
      - name: Build 10-second contact sheets
        run: |
          mkdir -p sheets
          ffmpeg -hide_banner -loglevel error -i current_patch_demo.mp4 \
            -vf "fps=1/10,scale=180:-1,tile=5x6" -q:v 5 sheets/sheet_%03d.jpg
          ls -lh sheets
      - name: Emit contact sheets
        shell: python
        run: |
          import base64
          from pathlib import Path
          for p in sorted(Path("sheets").glob("*.jpg")):
              print(f"BEGIN_SHEET {p.name}")
              print(base64.b64encode(p.read_bytes()).decode())
              print(f"END_SHEET {p.name}")
      - name: Upload source and sheets
        uses: actions/upload-artifact@v4
        with:
          name: current-patch-demo-sample
          path: |
            current_patch_demo.mp4
            sheets
          retention-days: 2
