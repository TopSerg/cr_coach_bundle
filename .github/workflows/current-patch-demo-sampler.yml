name: Current patch demo sampler

on:
  push:
    branches:
      - probe/current-patch-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect Redlib media markup
        shell: python
        run: |
          import re, urllib.request
          url="https://safereddit.com/r/ClashRoyale/comments/1wcndph/i_did_it_my_way/"
          req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req,timeout=25) as resp:
              text=resp.read().decode("utf-8","replace")
          open("redlib.html","w",encoding="utf-8").write(text)
          print("HTML_BYTES",len(text))
          for i,line in enumerate(text.splitlines()):
              if re.search(r"video|media|source|dash|hls|mp4|poster|gif",line,re.I):
                  print(f"HTML_LINE_{i}: {line[:4000]}")
      - name: Upload Redlib HTML
        uses: actions/upload-artifact@v4
        with:
          name: redlib-markup
          path: redlib.html
          retention-days: 1
