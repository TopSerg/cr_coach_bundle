name: Current patch demo sampler

on:
  push:
    branches:
      - probe/current-patch-demo
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probe/current-patch-demo
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade yt-dlp
      - name: Download first fresh-match window
        run: |
          yt-dlp -f "best[height<=240]/best" --merge-output-format mp4 \
            --download-sections "*00:00:00-00:03:00" \
            -o current_patch_demo.mp4 "https://www.twitch.tv/videos/2870511240"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 current_patch_demo.mp4
      - name: Build overview contact sheets
        run: |
          rm -rf probe_outputs
          mkdir -p probe_outputs/overview
          ffmpeg -hide_banner -loglevel error -ss 120 -t 60 -i current_patch_demo.mp4 \
            -vf "fps=1/1,scale=240:-1,tile=4x5" -q:v 4 probe_outputs/overview/sheet_%03d.jpg
          ls -lh probe_outputs/overview
      - name: Upload probe window
        uses: actions/upload-artifact@v4
        with:
          name: current-patch-first-3m
          path: |
            current_patch_demo.mp4
            probe_outputs/overview
          retention-days: 2
