name: Current patch demo sampler

on:
  push:
    branches:
      - probe/current-patch-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install yt-dlp
        run: python -m pip install --upgrade yt-dlp
      - name: List latest Morten Twitch VODs
        run: |
          yt-dlp --flat-playlist --playlist-end 12             --print "%(id)s|%(timestamp)s|%(duration)s|%(title)s"             "https://www.twitch.tv/mortenroyale/videos?filter=archives&sort=time"             | tee twitch_vods.txt
      - name: Upload VOD list
        uses: actions/upload-artifact@v4
        with:
          name: twitch-vod-list
          path: twitch_vods.txt
          retention-days: 1
