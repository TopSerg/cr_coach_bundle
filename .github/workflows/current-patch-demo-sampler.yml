name: Current patch demo sampler

on:
  push:
    branches:
      - probe/current-patch-demo
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Reddit post metadata
        run: |
          curl -fL --retry 3 -A "Mozilla/5.0 CR-Coach-Fidelity-Probe/1.0"             "https://www.reddit.com/comments/1wcndph.json?raw_json=1" -o reddit.json
          python - <<'PY'
          import json
          data=json.load(open("reddit.json",encoding="utf-8"))
          post=data[0]["data"]["children"][0]["data"]
          print("TITLE=", post.get("title"))
          print("CREATED_UTC=", post.get("created_utc"))
          candidates=[]
          def scan(obj):
              if isinstance(obj, dict):
                  rv=obj.get("reddit_video")
                  if isinstance(rv,dict) and rv.get("fallback_url"):
                      candidates.append(rv["fallback_url"])
                  for v in obj.values(): scan(v)
              elif isinstance(obj,list):
                  for v in obj: scan(v)
          scan(post)
          if not candidates:
              print(json.dumps(post.get("secure_media"),indent=2))
              raise SystemExit("No reddit_video fallback URL found")
          print("VIDEO_URL=", candidates[0])
          open("stream_url.txt","w",encoding="utf-8").write(candidates[0])
          PY
      - name: Download Reddit match video
        run: |
          curl -fL --retry 3 --retry-all-errors --connect-timeout 20             -A "Mozilla/5.0" -o current_patch_demo.mp4 "$(cat stream_url.txt)"
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 current_patch_demo.mp4
      - name: Build 5-second contact sheets
        run: |
          mkdir -p sheets
          ffmpeg -hide_banner -loglevel error -i current_patch_demo.mp4             -vf "fps=1/5,scale=180:-1,tile=5x6" -q:v 5 sheets/sheet_%03d.jpg
          ls -lh sheets
      - name: Emit contact sheets
        shell: python
        run: |
          import base64
          from pathlib import Path
          for p in sorted(Path("sheets").glob("*.jpg")):
              print(f"BEGIN_SHEET {p.name}")
              print(base64.b64encode(p.read_bytes()).decode())
              print(f"END_SHEET {p.name}")
      - name: Upload source and sheets
        uses: actions/upload-artifact@v4
        with:
          name: current-patch-reddit-match
          path: |
            current_patch_demo.mp4
            reddit.json
            sheets
          retention-days: 2
