name: Scan BigSpin Sep10 F2P tail

on:
  push:
    branches:
      - probe/current-patch-demo
    paths:
      - ".github/workflows/scan-bigspin-sep10-f2p.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade yt-dlp
      - name: Resolve 160p HLS
        run: |
          yt-dlp -g -f "160p/worst" "https://www.twitch.tv/videos/2870568499" | head -1 > stream_url.txt
      - name: Download one segment per 30s from final 2h
        shell: python
        run: |
          import json, subprocess, urllib.parse, urllib.request
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor, as_completed

          playlist_url=Path("stream_url.txt").read_text().strip()
          req=urllib.request.Request(playlist_url,headers={"User-Agent":"Mozilla/5.0"})
          text=urllib.request.urlopen(req,timeout=30).read().decode("utf-8","replace")
          lines=[x.strip() for x in text.splitlines() if x.strip()]
          segs=[]; cur=0.0; dur=None
          for line in lines:
              if line.startswith("#EXTINF:"):
                  dur=float(line.split(":",1)[1].split(",",1)[0])
              elif not line.startswith("#") and dur is not None:
                  segs.append({"start":cur,"end":cur+dur,"url":urllib.parse.urljoin(playlist_url,line)})
                  cur+=dur; dur=None
          start=max(0,int(cur)-7200)
          jobs=[]
          for sec in range(start,int(cur),30):
              idx=next((i for i,s in enumerate(segs) if s["start"]<=sec<s["end"]),None)
              if idx is not None:
                  jobs.append((sec,idx,segs[idx]))
          out=Path("segments"); out.mkdir()
          def fetch(job):
              sec,idx,s=job
              name=f"t_{sec:05d}_seg_{idx:05d}.ts"
              r=urllib.request.Request(s["url"],headers={"User-Agent":"Mozilla/5.0"})
              data=urllib.request.urlopen(r,timeout=30).read()
              (out/name).write_bytes(data)
              return {"requested_s":sec,"time":f"{sec//3600}:{(sec%3600)//60:02d}:{sec%60:02d}",
                      "segment_index":idx,"file":name,"bytes":len(data)}
          rows=[]
          with ThreadPoolExecutor(max_workers=16) as ex:
              for fut in as_completed([ex.submit(fetch,j) for j in jobs]):
                  rows.append(fut.result())
          rows.sort(key=lambda x:x["requested_s"])
          (out/"manifest.json").write_text(json.dumps({"duration":cur,"start":start,"samples":rows},indent=2),encoding="utf-8")
          print("duration",cur,"start",start,"downloaded",len(rows))
      - uses: actions/upload-artifact@v4
        with:
          name: bigspin-sep10-f2p-tail-scan
          path: segments
          retention-days: 1
