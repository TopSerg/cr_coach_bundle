name: build-card-fingerprints-once

on:
  workflow_dispatch:
  push:
    branches:
      - "feat/video-placement-annotator"
    paths:
      - ".github/workflows/build-card-fingerprints-once.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CR Coach branch
        uses: actions/checkout@v4
        with:
          ref: feat/video-placement-annotator
          fetch-depth: 0

      - name: Checkout card artwork once
        uses: actions/checkout@v4
        with:
          repository: RoyaleAPI/cr-api-assets
          path: .card_assets
          sparse-checkout: |
            cards-150
          sparse-checkout-cone-mode: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r tools/video_placement_annotator/requirements.txt

      - name: Build compact fingerprint DB
        shell: bash
        run: |
          ASSET_SHA="$(git -C .card_assets rev-parse HEAD)"
          python tools/video_placement_annotator/build_fingerprints.py \
            .card_assets/cards-150 \
            --stats tools/cr_hog_fidelity_test/current_card_stats_2026_09.json \
            --out tools/video_placement_annotator/card_fingerprints.json \
            --source-label "RoyaleAPI/cr-api-assets@${ASSET_SHA} cards-150" \
            --only-stats-cards \
            --collision-threshold 0.995 \
            --show-nearest 30

      - name: Commit versioned runtime database
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/video_placement_annotator/card_fingerprints.json
          if git diff --cached --quiet; then
            echo "Fingerprint database already up to date."
            exit 0
          fi
          git commit -m "Add current card fingerprint database [skip ci]"
          git push origin HEAD:feat/video-placement-annotator